name: firmware-watch

# Daily: ask Bigme's OTA server whether a newer stock firmware exists. If so, download it,
# extract blobs and firmware partitions, and open a PR against the private vendor repo
# with a diff report (changed blobs, kernel/DTB changes, new firmware partition versions).
#
# STATUS: the OTA endpoint is still unknown. It is found by reverse-engineering
# /system/bin/xrz_updater (PLAN.md Phase 2). Until FIRMWARE_ENDPOINT is configured this job
# only prints a notice.
on:
  schedule: [{ cron: "0 6 * * *" }]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for new stock firmware
        env:
          FIRMWARE_ENDPOINT: ${{ vars.FIRMWARE_ENDPOINT }}
          CURRENT_FW: ${{ vars.CURRENT_STOCK_FIRMWARE }}   # e.g. Bigme_HiBreak_EEA_V1.0_20260312
        run: |
          if [[ -z "$FIRMWARE_ENDPOINT" ]]; then
            echo "::notice::FIRMWARE_ENDPOINT not configured yet (Phase 2: RE xrz_updater)."
            exit 0
          fi
          scripts/ci/check-firmware.sh "$FIRMWARE_ENDPOINT" "$CURRENT_FW"
